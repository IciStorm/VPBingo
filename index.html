<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <title>Viva Piñata Bingo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            padding: 0;
            font-family: Arial, 'Comic Sans MS', sans-serif;
        }

        #layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
        }

        #settingsContainer {
            position: fixed;
            top: 0;
            right: 0;
            width: 400px;
            height: 100vh;
            background-color: #f9f9f9;
            box-shadow: -5px 0 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .bingo-title {
            font-family: 'Comic Sans MS', sans-serif;
            font-size: 24px;
            margin-top: 8px;
            margin-bottom: 16px;
            text-align: center;
        }

        .dropdown-text {
            text-align: center;
            margin-bottom: 8px;
        }

        .checkbox-position {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0px 32px 2px 4px;
        }

        #versionAndCredits {
            position: fixed;
            left: 5px;
            bottom: 5px;
            font-size: 12px;
            text-align: left;
        }

        label, input, select, button {
            margin-bottom: 15px;
            font-size: 14px;
        }

        table {
            border-collapse: collapse;
            margin-top: 30px;
        }

        table, th, td, img {
            border: 1px solid black;
            padding: 5px;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        img {
            display: block;
            border: none;
            outline: none;
            object-fit: cover;
        }

        td {
            position: relative;
        }

        .icon-container {
            position: relative;
            display: inline-block;
            pointer-events: auto;
        }

        .status-icon {
            position: absolute;
            top: 0;
            left: 0;
            width: 90%;
            height: 90%;
            object-fit: contain;
            pointer-events: none;
        }

        .pinata-icon {
            width: 75px;
            height: 75px;
            object-fit: cover;
            display: block;
        }

        .award-type {
            width: 40px;
            height: 40px;
            object-fit: cover;
            position: absolute;
            bottom: -15px;
            right: -15px;
        }

        .award-type2 {
            width: 40px;
            height: 40px;
            object-fit: cover;
            position: absolute;
            bottom: -15px;
            right: -10px;
        }

        #tableContainer {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        td:hover {
            background-color: #d3d3d3; // Color
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="layout">
        <div id="tableContainer"></div>

        <div id="settingsContainer">
    
            <div class="bingo-title">Viva Piñata Bingo</div>

            <div class="dropdown-text">
                <label for="seedInput">Table Seed</label>
            </div>
            <input type="text" id="seedInput" placeholder="10 Characters Maximum" maxlength="10" onchange="createTable()">
    
            <button onclick="generateRandomSeed()">Generate With Random Seed</button>

            <hr>

            <div class="dropdown-text">
                <label for="tableSize">Table Size</label>
            </div>
            <select id="tableSize" onchange="createTable()">
                <option value="3">3x3</option>
                <option value="4">4x4</option>
                <option value="5" selected>5x5</option>
                <option value="6">6x6</option>
                <option value="7">7x7</option>
            </select>

            <div class="dropdown-text">
                <label for="difficulty">Bingo Difficulty</label>
            </div>
            <select id="difficulty" onchange="createTable()">
                <option value="1" selected>Full Game (Levels 1-11)</option>
                <option value="2">Mid Game (Levels 1-7)</option>
                <option value="3">Early Game (Levels 1-4)</option>
            </select>
    
            <hr>
    
            <div class="checkbox-position">
                <label for="forceUnique">Force Unique Piñatas:</label>
                <input type="checkbox" id="forceUnique" onchange="createTable()">
            </div>

            <!--
            <div class="checkbox-position">
                <label for="enableTipSet">(WIP) Enable Trouble in Paradise Content:</label>
                <input type="checkbox" id="enableTipSet" onchange="createTable()">
            </div>
            -->
    
            <div class="checkbox-position">
                <label for="enablePlantSet">Enable Plants:</label>
                <input type="checkbox" id="enablePlantSet" onchange="createTable()">
            </div>
    
            <div class="checkbox-position">
                <label for="enableTinkerables">Enable Tinkerables:</label>
                <input type="checkbox" id="enableTinkerables" onchange="createTable()">
            </div>
    
            <hr>

            <div class="checkbox-position">
                <label for="disableAppearTask">Disable Appear Tasks:</label>
                <input type="checkbox" id="disableAppearTask" onchange="createTable()">
            </div>
            
            <div class="checkbox-position">
                <label for="disableVisitRibbon">Disable Visit Ribbon:</label>
                <input type="checkbox" id="disableVisitRibbon" onchange="createTable()">
            </div>
    
            <div class="checkbox-position">
                <label for="disableResidentRibbon">Disable Resident Ribbon:</label>
                <input type="checkbox" id="disableResidentRibbon" onchange="createTable()">
            </div>
    
            <div class="checkbox-position">
                <label for="disableVariantRibbon">Disable Variant Ribbons:</label>
                <input type="checkbox" id="disableVariantRibbon" onchange="createTable()">
            </div>
    
            <div class="checkbox-position">
                <label for="disableRomanceRibbon">Disable Romance Ribbon:</label>
                <input type="checkbox" id="disableRomanceRibbon" onchange="createTable()">
            </div>
    
           <div class="checkbox-position">
                <label for="disableMasterRomanceRibbon">Disable Master Romance Ribbon:</label>
                <input type="checkbox" id="disableMasterRomanceRibbon" onchange="createTable()">
            </div>
    
        </div>

        <div id="versionAndCredits">
            <div>IciStorm</div>
            <div>Version 1.1.0</div>
        </div>
    </div>

    <script src="tableFunctions.js"></script>
    <script src="awardTypes.js"></script>
    <script src="validCombos.js"></script>
    <script src="secretSeeds.js"></script>
    <script src="pinataIcons.js"></script>
    <script src="plantIcons.js"></script>
    <script src="tinkerIcons.js"></script>

    <script>
        // Overlay icons for marking a task on the bingo
        const checkmark = 'https://github.com/IciStorm/VPBingo/blob/main/images/status/UI_Icon_Check.PNG?raw=true';
        const crossmark = 'https://github.com/IciStorm/VPBingo/blob/main/images/status/UI_Icon_X.PNG?raw=true';

        let usedCombinations = new Set(); // Stores created tasks to prevent duplicates from showing up
        let lastTaskCountWasZero = false;

        // Controls which awards appear based on checkbox settings
        function getEnabledAwards() {
            const enabledAwards = new Set(awardTypeIcons);
            if (document.getElementById('disableAppearTask').checked) { // No appear tasks
                enabledAwards.delete(awardTypeIcons[1]);
            }
            if (document.getElementById('disableVisitRibbon').checked) { // No visit tasks
                enabledAwards.delete(awardTypeIcons[2]);
            }
            if (document.getElementById('disableResidentRibbon').checked) { // No residency tasks
                enabledAwards.delete(awardTypeIcons[3]);
            }
            if (document.getElementById('disableVariantRibbon').checked) { // No variant tasks
                enabledAwards.delete(awardTypeIcons[4]);
                enabledAwards.delete(awardTypeIcons[5]);
                enabledAwards.delete(awardTypeIcons[6]);
            }
            if (document.getElementById('disableRomanceRibbon').checked) { // No romance tasks
                enabledAwards.delete(awardTypeIcons[7]);
            }
            if (document.getElementById('disableMasterRomanceRibbon').checked) { // No master romance tasks
                enabledAwards.delete(awardTypeIcons[8]);
            }
            return Array.from(enabledAwards); // Return reduced array of available awards
        }

        // Controls task list based on difficulty setting
        function getTasksByDifficulty(allTasks, difficulty) {
            let tasklist = allTasks;
            switch (difficulty) {
                case 1:
                    return tasklist.filter(t => t.level <= 11); // Task levels 1-11 are used
                case 2:
                    return tasklist.filter(t => t.level <= 7);  // Task levels 1-7 are used
                case 3:
                    return tasklist.filter(t => t.level <= 4);  // Task levels 1-4 are used
                default:
                    return tasklist;
            }
        }

        function checkAwardByDifficulty(pinataURL, award, difficulty) { // Should make this more readable in the future by giving names to awardTypeIcons
            const pinata = pinataIcons.find(p => p.url === pinataURL);
            if (!pinata) return false; // Ignore if not a pinata
            
            const maxLevel = difficulty === 1 ? 11 : difficulty === 2 ? 7 : difficulty === 3 ? 4 : 11;
            
            if (award === awardTypeIcons[4]) return pinataIcons.find(p => p.url === pinataURL).var1 > maxLevel;
            if (award === awardTypeIcons[5]) return pinataIcons.find(p => p.url === pinataURL).var2 > maxLevel;
            if (award === awardTypeIcons[6]) return pinataIcons.find(p => p.url === pinataURL).var3 > maxLevel;

            return false; // Ignore filter, not a variant award
        }

        // RNG Generator so things get random
        function seededRandom(seed) {
            var x = Math.sin(seed) * 1049;
            return x - Math.floor(x);
        }

        // If "Generate with Random Seed" is clicked, gets a new seed
        function generateRandomSeed() {
            document.getElementById('seedInput').value = Math.floor(Math.random() * 1000000000);
            createTable();
        }

        // Cleans seed of non-numeric characters and sets to lowercase. Retur
        function checkSeed(seed) {
            const strSeed = seed.trim().toLowerCase();
            if (typeof seed === 'string' && secretSeeds.hasOwnProperty(strSeed)) {
                return strSeed;
            }
            return seed.replace(/\D/g, "");
        }
        
        function getValidCombo(iconArray, enabledAwards, seed, index) {
            let attempts = 0;
            
            while (attempts < 10000) {
                const randomPinataIndex = Math.floor(seededRandom(seed + index + attempts * 31) * iconArray.length);
                const pinataObj = iconArray[randomPinataIndex];
                const pinataIcon = pinataObj.url;
        
                const validAwards = validCombos[pinataIcon]?.filter(award => enabledAwards.includes(award)) || [];
        
                const availableAwards = validAwards.filter(award => !usedCombinations.has(`${pinataIcon}-${award}`) && 
                    !checkAwardByDifficulty(pinataIcon, award, parseInt(document.getElementById('difficulty').value, 10)));
        
                if (availableAwards.length > 0) {
                    const randomAwardIndex = Math.floor(seededRandom(seed + index + attempts + 1) * availableAwards.length);
                    const selectedAward = availableAwards[randomAwardIndex];
                    usedCombinations.add(`${pinataIcon}-${selectedAward}`);
                    return { pinata: pinataIcon, award: selectedAward };
                }
                attempts++;
            }
        
            return { pinata: awardTypeIcons[14], award: awardTypeIcons[0] }; // No valid combination can be found, display an error
        }

        function toggleOverlayImage(cell) {
            const existingOverlay = cell.querySelector('.status-icon');
            if (existingOverlay) {
                if (existingOverlay.src === checkmark) {
                    existingOverlay.src = crossmark; // Switch to Crossmark on second click
                } else if (existingOverlay.src === crossmark) {
                    existingOverlay.remove(); // Remove overlay if third click
                }
            } else {
                const overlayImg = document.createElement('img');
                overlayImg.src = checkmark; // Use Checkmark on first click
                overlayImg.classList.add('status-icon');
                cell.appendChild(overlayImg);
            }
        }

        // Builds the table
        function createTable() {
            usedCombinations.clear();
        
            const settings = getBoardSettings(); // Gets bingo settings
            const enabledAwards = getEnabledAwards();

            // Filters icon sets based on selected difficulty and level
            let filteredPinatas = pinataIcons;
            let filteredPlants = plantIcons;
            let filteredTinkerables = tinkerIcons;

            // Only use settings if not in a secret seed, to allow secret seeds specific combinations
            if (!settings.isSecret) {
                filteredPinatas = getTasksByDifficulty(pinataIcons, settings.difficulty);
                filteredPlants = getTasksByDifficulty(plantIcons, settings.difficulty);
                filteredTinkerables = getTasksByDifficulty(tinkerIcons, settings.difficulty);
            }

            // Build valid iconpool
            let iconPool = settings.isSecret
                ? secretSeeds[settings.rawSeed].iconSet
                : (settings.enablePlants && settings.enableTinkerables)
                    ? [...filteredPinatas, ...filteredPlants, ...filteredTinkerables]
                    : settings.enablePlants
                        ? [...filteredPinatas, ...filteredPlants]
                        : settings.enableTinkerables
                            ? [...filteredPinatas, ...filteredTinkerables]
                            : filteredPinatas;

            // Generate tasks for the board
            const tasks = generateTasks(settings, enabledAwards, iconPool);
            const taskCount = tasks.length;
            
            // Based on how many tasks were produced, get a new size for the board
            let finalSize;
            if (taskCount === 0) {
                finalSize = 0; // Empty board
                lastTaskCountWasZero = true;
            } else if (lastTaskCountWasZero) {
                // If previously we had 0, let it snap back to largest size possible
                finalSize = getMaxSquareSize(taskCount);
                lastTaskCountWasZero = false;
            } else {
                finalSize = taskCount < settings.size * settings.size
                    ? getMaxSquareSize(taskCount)
                    : settings.size;
            }
        
            renderBoard(tasks.slice(0, finalSize * finalSize), finalSize);

            if (tasks.length > 0) {
                document.getElementById('tableSize').value = finalSize; // Update dropdown element to show new size
                settings.size = finalSize;
            }
        }
                        

        // Create initial table with a random seed
        createTable();
    </script>

</body>
</html>
