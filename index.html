<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva Piñata Bingo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            padding: 0;
            font-family: Arial, 'Comic Sans MS', sans-serif;
        }

        #layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
        }

        #settingsContainer {
            position: fixed;
            top: 0;
            right: 0;
            width: 400px;
            height: 100vh;
            background-color: #f9f9f9;
            box-shadow: -5px 0 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .bingo-title {
            font-family: 'Comic Sans MS', sans-serif;
            font-size: 24px;
            margin-top: 8px;
            margin-bottom: 16px;
            text-align: center;
        }

        .checkbox-position {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0px 32px 2px 4px;
        }

        label, input, select, button {
            margin-bottom: 15px;
            font-size: 14px;
        }

        table {
            border-collapse: collapse;
            margin-top: 30px;
        }

        table, th, td, img {
            border: 1px solid black;
            padding: 5px;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        img {
            display: block;
            border: none;
            outline: none;
            object-fit: cover;
        }

        td {
            position: relative;
        }

        .icon-container {
            position: relative;
            display: inline-block;
            pointer-events: auto;
        }

        .status-icon {
            position: absolute;
            top: 0;
            left: 0;
            width: 90%;
            height: 90%;
            object-fit: contain;
            pointer-events: none;
        }

        .pinata-icon {
            width: 75px;
            height: 75px;
            object-fit: cover;
            display: block;
        }

        .award-type {
            width: 40px;
            height: 40px;
            object-fit: cover;
            position: absolute;
            bottom: -15px;
            right: -15px;
        }

        #tableContainer {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        td:hover {
            background-color: #d3d3d3; // Color
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="layout">
        <div id="tableContainer"></div>

        <div id="settingsContainer">
    
            <div class="bingo-title">Viva Piñata Bingo</div>
    
            <label for="seedInput">Table Seed</label>
            <input type="text" id="seedInput" placeholder="Leave Empty for Random Seed">
    
            <button onclick="createTable()">Generate Using Seed</button>
            <button onclick="generateRandomSeed()">(TESTING) Generate With Random Seed</button>
            
            <label for="tableSize">Table Size</label>
            <select id="tableSize" onchange="createTable()">
                <option value="3">3x3</option>
                <option value="4">4x4</option>
                <option value="5" selected>5x5</option>
                <option value="6">6x6</option>
                <option value="7">7x7</option>
            </select>
    
            <label for="difficulty">(WIP) Bingo Difficulty</label>
            <select id="difficulty" onchange="createTable()">
                <option value="1">Easy (Levels 1-3)</option>
                <option value="2">Medium (Levels 1-6)</option>
                <option value="3">Hard (Levels 1-10)</option>
            </select>
    
            <hr>
    
            <div class="checkbox-position">
                <label for="forceUnique">Force Unique Piñatas:</label>
                <input type="checkbox" id="forceUnique" onchange="createTable()">
            </div>
    
            <div class="checkbox-position">
                <label for="enableTipSet">(WIP) Enable Trouble in Paradise Content:</label>
                <input type="checkbox" id="enableTipSet" onchange="createTable()">
            </div>
    
            <div class="checkbox-position">
                <label for="enablePlantSet">Enable Plants:</label>
                <input type="checkbox" id="enablePlantSet" onchange="createTable()">
            </div>
    
            <div class="checkbox-position">
                <label for="enableTinkerables">Enable Tinkerables:</label>
                <input type="checkbox" id="enableTinkerables" onchange="createTable()">
            </div>
    
            <div class="checkbox-position">
                <label for="">(WIP) Enable Additonal Missions:</label>
                <input type="checkbox" id="" onchange="createTable()">
            </div>
    
            <hr>
    
            <div class="checkbox-position">
                <label for="disableVisitRibbon">Disable Visit Ribbon:</label>
                <input type="checkbox" id="disableVisitRibbon" onchange="createTable()">
            </div>
    
            <div class="checkbox-position">
                <label for="disableResidentRibbon">Disable Resident Ribbon:</label>
                <input type="checkbox" id="disableResidentRibbon" onchange="createTable()">
            </div>
    
            <div class="checkbox-position">
                <label for="disableVariantRibbon">Disable Variant Ribbons:</label>
                <input type="checkbox" id="disableVariantRibbon" onchange="createTable()">
            </div>
    
            <div class="checkbox-position">
                <label for="disableRomanceRibbon">Disable Romance Ribbon:</label>
                <input type="checkbox" id="disableRomanceRibbon" onchange="createTable()">
            </div>
    
           <div class="checkbox-position">
                <label for="disableMasterRomanceRibbon">Disable Master Romance Ribbon:</label>
                <input type="checkbox" id="disableMasterRomanceRibbon" onchange="createTable()">
            </div>
    
        </div>
    </div>

    <script src="validCombos.js"></script>
    <script src="secretSeeds.js"></script>
    <script src="pinataIcons.js"></script>
    <script src="plantIcons.js"></script>
    <script src="tinkerIcons.js"></script>

    <script>

        const tipIcons = [ // Move to js file when icons are obtained
            'Sweetle',
            'Camello',
            'Bispotti',
            'Sour Lemmoning'
            // Add TiP Set when possible
        ];

        const tipPlantIcons = [ // Move to js file when icons are obtained
            'PlantA',
            'PlantB',
            'PlantC'
        ];

        const awardTypeIcons = [
            'https://github.com/IciStorm/VPBingo/blob/main/images/awards/UI_Icon_ErrorHandler.PNG?raw=true',
            'https://github.com/IciStorm/VPBingo/blob/main/images/awards/UI_Icon_VisitRibbon.PNG?raw=true',
            'https://github.com/IciStorm/VPBingo/blob/main/images/awards/UI_Icon_VariantRibbon.PNG?raw=true',
            'https://github.com/IciStorm/VPBingo/blob/main/images/awards/UI_Icon_VariantRibbon1.PNG?raw=true',
            'https://github.com/IciStorm/VPBingo/blob/main/images/awards/UI_Icon_VariantRibbon2.PNG?raw=true',
            'https://github.com/IciStorm/VPBingo/blob/main/images/awards/UI_Icon_VariantRibbon3.PNG?raw=true',
            'https://github.com/IciStorm/VPBingo/blob/main/images/awards/UI_Icon_RomanceRibbon.PNG?raw=true',
            'https://github.com/IciStorm/VPBingo/blob/main/images/awards/UI_Icon_MasterRomanceRibbon.PNG?raw=true',
            'https://github.com/IciStorm/VPBingo/blob/main/images/awards/UI_Icon_ResideRibbon.PNG?raw=true',
            'https://github.com/IciStorm/VPBingo/blob/main/images/awards/UI_Icon_PlantRibbon.PNG?raw=true',
            'TempForFertilizeAward',
            'https://github.com/IciStorm/VPBingo/blob/main/images/awards/UI_Icon_Charactor_Bart.PNG?raw=true'
        ];

        const checkmark = 'https://github.com/IciStorm/VPBingo/blob/main/images/status/UI_Icon_Check.PNG?raw=true';
        const crossmark = 'https://github.com/IciStorm/VPBingo/blob/main/images/status/UI_Icon_X.PNG?raw=true';

        let usedCombinations = new Set();

        function getEnabledAwards() { // Controls which awards appear based on checkbox settings
            const enabledAwards = new Set(awardTypeIcons);
            if (document.getElementById('disableVisitRibbon').checked) {
                enabledAwards.delete(awardTypeIcons[1]);
            }
            if (document.getElementById('disableVariantRibbon').checked) {
                enabledAwards.delete(awardTypeIcons[2]);
                enabledAwards.delete(awardTypeIcons[3]);
                enabledAwards.delete(awardTypeIcons[4]);
                enabledAwards.delete(awardTypeIcons[5]);
            }
            if (document.getElementById('disableRomanceRibbon').checked) {
                enabledAwards.delete(awardTypeIcons[6]);
            }
            if (document.getElementById('disableMasterRomanceRibbon').checked) {
                enabledAwards.delete(awardTypeIcons[7]);
            }
            if (document.getElementById('disableResidentRibbon').checked) {
                enabledAwards.delete(awardTypeIcons[8]);
            }
            return Array.from(enabledAwards);
        }

        // RNG Generator so things get random
        function seededRandom(seed) {
            var x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        function generateRandomSeed() {
            document.getElementById('seedInput').value = Math.floor(Math.random() * 1000000000);
            createTable();
        }
            
        function checkSeed(seed) {
            const strSeed = seed.trim().toLowerCase();
            if (typeof seed === 'string' && secretSeeds.hasOwnProperty(strSeed)) {
                return strSeed;
            }
            return seed.replace(/\D/g, "");
        }
        
        function getValidCombo(iconArray, enabledAwards, seed, index) {
            let attempts = 0;
            
            while (attempts < 10000) {
                const randomPinataIndex = Math.floor(seededRandom(seed + index + attempts * 31) * iconArray.length);
                const pinataIcon = iconArray[randomPinataIndex];
        
                const validAwards = validCombos[pinataIcon]?.filter(award => enabledAwards.includes(award)) || [];
        
                const availableAwards = validAwards.filter(award => !usedCombinations.has(`${pinataIcon}-${award}`));
        
                if (availableAwards.length > 0) {
                    const randomAwardIndex = Math.floor(seededRandom(seed + index + attempts + 1) * availableAwards.length);
                    const selectedAward = availableAwards[randomAwardIndex];
        
                    usedCombinations.add(`${pinataIcon}-${selectedAward}`);
                    return { pinata: pinataIcon, award: selectedAward };
                }
                attempts++;
            }
        
            return { pinata: awardTypeIcons[0], award: awardTypeIcons[0] }; // No valid combination can be found, display an error
        }

        function toggleOverlayImage(cell) {
            const existingOverlay = cell.querySelector('.status-icon');
            if (existingOverlay) {
                if (existingOverlay.src === checkmark) {
                    existingOverlay.src = crossmark; // Switch to Crossmark on second click
                } else if (existingOverlay.src === crossmark) {
                    existingOverlay.remove(); // Remove overlay if third click
                }
            } else {
                const overlayImg = document.createElement('img');
                overlayImg.src = checkmark; // Use Checkmark on first click
                overlayImg.classList.add('status-icon');
                cell.appendChild(overlayImg);
            }
        }
        
        function createTable() {
            usedCombinations.clear();
            let seed = document.getElementById('seedInput').value;
            seed = checkSeed(seed);
            let isSecret = typeof seed === 'string' && secretSeeds.hasOwnProperty(seed);
            
            if (seed === '') {
                seed = Math.floor(Math.random() * 1000000000); // Generate a random seed
                document.getElementById('seedInput').value = seed; // Display the current seed
            }
            seed = isSecret ? seed : parseInt(seed)

            const size = parseInt(document.getElementById('tableSize').value);
            const enableTipSet = document.getElementById('enableTipSet').checked;
            const enablePlantSet = document.getElementById('enablePlantSet').checked;
            const enableTinkerables = document.getElementById('enableTinkerables').checked;
            const tableContainer = document.getElementById('tableContainer');
            tableContainer.innerHTML = ''; // Clear the previous table

            const table = document.createElement('table');
            const enabledAwards = getEnabledAwards();
            const forceUnique = document.getElementById('forceUnique').checked;

            let iconPool;
            if (isSecret) {
                iconPool = secretSeeds[seed].iconSet;
            } else {
                iconPool =
                    (enablePlantSet && enableTinkerables && enableTipSet) ? [...tipIcons, ...plantIcons, ...tipPlantIcons, ...tinkerIcons, ...tipTinkerIcons, ...pinataIcons] :
                    (enablePlantSet && enableTipSet) ? [...tipIcons, ...plantIcons, ...tipPlantIcons, ...pinataIcons] :
                    (enableTinkerables && enableTipSet) ? [...tipIcons, ...tinkerIcons, ...tipTinkerIcons, ...pinataIcons] :
                    (enablePlantSet && enableTinkerables) ? [...tinkerIcons, ...plantIcons, ...pinataIcons] : 
                    enableTipSet ? [...tipIcons, ...pinataIcons] : 
                    enablePlantSet ? [...plantIcons, ...pinataIcons] :  
                    enableTinkerables ? [...tinkerIcons, ...pinataIcons] : 
                    pinataIcons;
            }
            
            let unusedPinatas = [...iconPool]; // To handle cases where forceUnique is enabled
            let index = 0; // To vary the seed for each cell
            
            for (let i = 0; i < size; i++) {
                const row = document.createElement('tr');

                for (let j = 0; j < size; j++) {
                    const cell = document.createElement('td');
                    const iconContainer = document.createElement('div');
                    iconContainer.classList.add('icon-container');

                    let {pinata, award} = getValidCombo(iconPool, enabledAwards, seed, index);
                    
                    if (forceUnique) {
                        let attempts = 0;
                        while (attempts < 10000) {
                            const randomIndex = Math.floor(seededRandom(seed + index + attempts) * unusedPinatas.length);
                            pinata = unusedPinatas[randomIndex];

                            // Get a random valid award for the selected piñata
                            const validAwards = validCombos[pinata]?.filter(award => enabledAwards.includes(award)) || [];
                            if (validAwards.length > 0) {
                                const randomAwardIndex = Math.floor(seededRandom(seed + index + attempts) * validAwards.length);
                                award = validAwards[randomAwardIndex];
                                unusedPinatas.splice(randomIndex, 1); // Remove selected piñata from the pool
                                break;
                            }
                            else attempts++;
                        }

                        if (attempts == 10000) {
                            pinata = 'https://github.com/IciStorm/VPBingo/blob/main/images/awards/UI_Icon_ErrorHandler.PNG?raw=true';
                            award = 'https://github.com/IciStorm/VPBingo/blob/main/images/awards/UI_Icon_ErrorHandler.PNG?raw=true';
                        }
                    }
                        
                    const mainIcon = document.createElement('img');
                    mainIcon.src = pinata;
                    mainIcon.classList.add('pinata-icon');
                    iconContainer.appendChild(mainIcon);

                    const awardIcon = document.createElement('img');
                    awardIcon.src = award;
                    awardIcon.classList.add('award-type');
                    iconContainer.appendChild(awardIcon);

                    cell.appendChild(iconContainer);
                    row.appendChild(cell);

                    cell.addEventListener('click', function () {
                        toggleOverlayImage(cell);
                    });

                    index++;
                }

                table.appendChild(row);
            }

            tableContainer.appendChild(table);
        }

        // Create initial table with a random seed
        createTable();
    </script>

</body>
</html>
